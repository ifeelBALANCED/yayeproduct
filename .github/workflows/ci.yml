name: CI

# P0-4 (docs/quality-gate.md §1): default-гілка репозиторію — master.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PNPM_VERSION: '9.14.4'
  NODE_VERSION: '20'

jobs:
  # ─── S0 · Static (ціль < 3 хв) ──────────────────────────────────────────
  # docs/quality-gate.md §3 S0: format, secrets, audit, arch, dead-code, dup,
  # lint, typecheck — всі в одному job, послідовно.
  s0-static:
    name: S0 · Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks потребує повної git-історії для перевірки
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Format — будь-який diff = fail
      - name: Format check (prettier)
        run: pnpm format:check

      # Secrets — будь-який знахід = fail (P0-2)
      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deps audit — high/critical = fail; serialize-javascript override у root package.json
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

      # Arch conformance — порушення §2.2 = fail
      - name: Architecture conformance (dependency-cruiser)
        run: pnpm depcruise

      # Dead code — новий unused export = fail
      - name: Dead code (knip)
        run: pnpm knip

      # Duplication — новий клон > 25 рядків = fail
      - name: Duplication (jscpd)
        run: pnpm dup

      # Lint — error = fail
      - name: Lint
        run: pnpm lint

      # Typecheck — strict + noUncheckedIndexedAccess
      - name: Typecheck
        run: pnpm typecheck

  # ─── S1 · Unit (ціль < 2 хв, без dependsOn ^build — P0-6) ──────────────
  # docs/quality-gate.md §3 S1: packages/method тести, coverage у CI.
  s1-unit:
    name: S1 · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # P0-4: пакет перейменовано clinical → method; coverage-шлях виправлено.
      # Coverage-пороги enforced у Phase 1 (S1) — packages/method/vitest.config.ts.
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: packages/method/coverage/
          if-no-files-found: warn

  # ─── S2 · Integration + DB (ціль < 6 хв) ────────────────────────────────
  # docs/quality-gate.md §3 S2: supabase local, RLS-матриця, schema-contract,
  # API-інтеграційні тести (реальна БД + фейковий AnthropicPort).
  s2-integration:
    name: S2 · Integration + DB
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Supabase CLI — версія запінена (caveat: gen types формат v2.x).
      # При оновленні CLI перевір структуру Relationships у gen types output.
      - uses: supabase/setup-cli@v1
        with:
          version: 1.207.9

      # Запуск Supabase local (Docker обов'язковий на runner — ubuntu-latest має його).
      - name: Start Supabase local
        run: supabase start

      # Міграції з нуля + seed (supabase/seed.sql: therapist seed для RLS-тестів).
      - name: Reset DB (migrations + seed)
        run: supabase db reset --local

      # Schema-contract: дрейф types.ts → fail (docs/quality-gate.md §S2).
      - name: Schema contract check
        run: bash scripts/check-db-types.sh

      # S2 + S1 unit-тести (integration env-gated через SUPABASE_TEST_URL).
      # Стандартні demo-ключі Supabase local — не секрети.
      - name: Run tests (unit + integration)
        env:
          SUPABASE_TEST_URL: 'http://127.0.0.1:54321'
          SUPABASE_TEST_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRFA0NiK7URIqUfev2Y864T4SuTHrevNyYJqFnug8tA'
          SUPABASE_TEST_SERVICE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hj04zWl196z2-SBc0'
          # SESSION_TOKEN_SECRET: dev-фолбек активний у тестах (NODE_ENV != production)
          ANTHROPIC_PROMPT_VERSION: 'v1.8'
        run: pnpm --filter @ya-ye/teen test

  # ─── S5 · Security (SAST) ────────────────────────────────────────────────
  # docs/quality-gate.md §3 S5: semgrep OWASP top-10 + кастомні правила.
  # Кастомні правила (заборона SERVICE_ROLE_KEY поза server/adapters,
  # PII у console.log тощо) — у .semgrep/ (створює агент C).
  # Цей job тільки запускає semgrep — правила не генерує.
  s5-security:
    name: S5 · Security (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SAST scan (semgrep)
        uses: semgrep/semgrep-action@v2
        with:
          # OWASP top-10 ruleset + кастомні правила проєкту (.semgrep/)
          # docs/quality-gate.md §S5: будь-яке знахід → error → fail
          config: >-
            p/owasp-top-ten
            .semgrep/
        env:
          # SEMGREP_APP_TOKEN: не обов'язковий для OSS scan.
          # Якщо є — підвантажує Semgrep Pro rules.
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
