name: CI

# P0-4 (docs/quality-gate.md §1): default-гілка репозиторію — master.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PNPM_VERSION: '9.14.4'
  NODE_VERSION: '20'

jobs:
  # ─── S0 · Static (ціль < 3 хв) ──────────────────────────────────────────
  # docs/quality-gate.md §3 S0: format, secrets, audit, arch, dead-code, dup,
  # lint, typecheck — всі в одному job, послідовно.
  s0-static:
    name: S0 · Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks потребує повної git-історії для перевірки
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Format — будь-який diff = fail
      - name: Format check (prettier)
        run: pnpm format:check

      # Secrets — будь-який знахід = fail (P0-2)
      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deps audit — high/critical = fail; serialize-javascript override у root package.json
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

      # Arch conformance — порушення §2.2 = fail
      - name: Architecture conformance (dependency-cruiser)
        run: pnpm depcruise

      # Dead code — новий unused export = fail
      - name: Dead code (knip)
        run: pnpm knip

      # Duplication — новий клон > 25 рядків = fail
      - name: Duplication (jscpd)
        run: pnpm dup

      # Lint — error = fail
      - name: Lint
        run: pnpm lint

      # Typecheck — strict + noUncheckedIndexedAccess
      - name: Typecheck
        run: pnpm typecheck

  # ─── S1 · Unit (ціль < 2 хв, без dependsOn ^build — P0-6) ──────────────
  # docs/quality-gate.md §3 S1: packages/method тести, coverage у CI.
  s1-unit:
    name: S1 · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # P0-4: пакет перейменовано clinical → method; coverage-шлях виправлено.
      # Coverage-пороги enforced у Phase 1 (S1) — packages/method/vitest.config.ts.
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: packages/method/coverage/
          if-no-files-found: warn
